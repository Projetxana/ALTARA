name: ALTARA Calendar Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync_calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Sync ALTARA calendars
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALTARA_HOST: altara-prod.vercel.app

        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is missing."
            exit 1
          fi

          HTTP_STATUS=$(curl -sS             -o response.json             -w "%{http_code}"             -X POST             -H "Authorization: Bearer ${CRON_SECRET}"             -H "Content-Type: application/json"             "https://${ALTARA_HOST}/api/sync")

          echo "HTTP status: ${HTTP_STATUS}"

          cat response.json
          echo

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            exit 1
          fi

          jq -e '.success == true' response.json >/dev/null

          echo "ALTARA calendar sync successful."
