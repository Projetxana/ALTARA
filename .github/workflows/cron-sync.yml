name: 24/7 Calendar Sync Cron

on:
  schedule:
    # Toutes les 15 minutes (plus raisonnable que 5 min)
    - cron: '*/15 * * * *'
  # Permet l'exécution manuelle depuis l'onglet Actions
  workflow_dispatch:

jobs:
  sync_calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ALTARA Sync Engine
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # URL de production — à vérifier dans Vercel
          SYNC_URL: ${{ vars.SYNC_URL || 'https://chaletayana.ca/api/cron-sync' }}
        run: |
          echo "🔄 Triggering Calendar Sync..."
          
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${SYNC_URL}")
          
          echo "==== HTTP Status: ${HTTP_STATUS} ===="
          echo "==== Response ===="
          cat response.json | head -c 2000
          echo ""
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Sync completed successfully."
          elif [ "$HTTP_STATUS" -eq 401 ]; then
            echo "❌ UNAUTHORIZED — Check CRON_SECRET in GitHub Secrets and Vercel env vars."
            exit 1
          else
            echo "⚠️ Sync returned HTTP ${HTTP_STATUS}"
            # Don't fail the job for non-auth errors — the sync engine handles errors gracefully
          fi
